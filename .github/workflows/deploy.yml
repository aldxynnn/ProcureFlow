name: ProcureFlow Deploy
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY_API: ${{ vars.ECR_REPOSITORY_API }}
  ECR_REPOSITORY_WEB: ${{ vars.ECR_REPOSITORY_WEB }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE_API: ${{ vars.ECS_SERVICE_API }}
  ECS_SERVICE_WEB: ${{ vars.ECS_SERVICE_WEB }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Build and push API
        run: |
          API_IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY_API}:${GITHUB_SHA}"
          docker build -f apps/api/Dockerfile -t "$API_IMAGE" .
          docker push "$API_IMAGE"
          docker tag "$API_IMAGE" "${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY_API}:latest"
          docker push "${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY_API}:latest"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
      - name: Build and push Web
        run: |
          WEB_IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY_WEB}:${GITHUB_SHA}"
          docker build -f apps/web/Dockerfile -t "$WEB_IMAGE" .
          docker push "$WEB_IMAGE"
          docker tag "$WEB_IMAGE" "${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY_WEB}:latest"
          docker push "${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY_WEB}:latest"
          echo "WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"
      - name: Update ECS services
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE_API" --force-new-deployment >/dev/null
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE_WEB" --force-new-deployment >/dev/null
          echo "ECS services requested a rolling deployment. ECS task definitions should reference the mutable :latest image tags; the immutable SHA tags remain available for traceability."
