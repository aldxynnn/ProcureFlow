name: ProcureFlow CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: procureflow
          POSTGRES_PASSWORD: procureflow
          POSTGRES_DB: procureflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U procureflow -d procureflow"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://procureflow:procureflow@localhost:5432/procureflow?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      FRONTEND_ORIGIN: http://localhost:3000
      COOKIE_SECURE: 'false'
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./tmp/uploads
      API_PORT: 4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: API e2e
        run: npm --workspace apps/api run test:e2e
